[loggers]
keys=root,uvicorn,fastapi,audit

[handlers]
keys=consoleHandler, timedRotatingFileHandler

[formatters]
keys=fileFormatter, consoleFormatter

[logger_root]
level=DEBUG
handlers=timedRotatingFileHandler, consoleHandler

[logger_uvicorn]
level=DEBUG
handlers=timedRotatingFileHandler, consoleHandler
qualname=uvicorn
propagate=0

[logger_fastapi]
level=DEBUG
handlers=timedRotatingFileHandler, consoleHandler
qualname=fastapi
propagate=0

[logger_audit]
level=INFO
handlers=timedRotatingFileHandler, consoleHandler
qualname=audit
propagate=0

# stdout 은 feed 파이프라인의 콘텐츠 채널이다(Process.exec_cmd 가 post_process 스크립트의
# stdout 을 HTML content 로 캡처). 로그는 반드시 stderr 로 내보내야 HTML 이 오염되지 않는다.
[handler_consoleHandler]
level=INFO
class=StreamHandler
formatter=consoleFormatter
args=(sys.stderr,)

[handler_timedRotatingFileHandler]
level=DEBUG
class=handlers.TimedRotatingFileHandler
formatter=fileFormatter
args=('run.log', 'midnight', 1, 1, 'utf-8', False, False)

[formatter_fileFormatter]
format=[%(asctime)s][%(filename)s:%(lineno)d][%(levelname)s] %(message)s

[formatter_consoleFormatter]
format=%(message)s
