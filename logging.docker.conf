# 컨테이너 전용 로깅 설정 (Dockerfile이 /app/logging.conf 로 복사).
# readOnlyRootFilesystem 호환을 위해 파일 핸들러 없이 stderr 로만 출력하고,
# 로그 수집은 k8s(kubectl logs / 수집기)가 담당한다. 로테이션도 kubelet 이 처리.
# 호스트 CLI 는 repo 의 logging.conf(파일 핸들러 포함)를 그대로 사용한다.

[loggers]
keys=root,uvicorn,fastapi,audit

[handlers]
keys=consoleHandler

[formatters]
keys=consoleFormatter

[logger_root]
level=DEBUG
handlers=consoleHandler

[logger_uvicorn]
level=DEBUG
handlers=consoleHandler
qualname=uvicorn
propagate=0

[logger_fastapi]
level=DEBUG
handlers=consoleHandler
qualname=fastapi
propagate=0

[logger_audit]
level=INFO
handlers=consoleHandler
qualname=audit
propagate=0

# stdout 은 feed 파이프라인의 콘텐츠 채널이다(Process.exec_cmd 가 post_process 스크립트의
# stdout 을 HTML content 로 캡처). 로그를 stdout 으로 내보내면 그 줄이 그대로 생성 HTML
# 본문에 섞이므로 stderr 로 내보낸다. k8s 는 stdout/stderr 를 모두 수집한다.
# level 은 INFO(호스트 logging.conf 와 동일)로 두어 DEBUG 로그량을 억제한다.
[handler_consoleHandler]
level=INFO
class=StreamHandler
formatter=consoleFormatter
args=(sys.stderr,)

[formatter_consoleFormatter]
format=[%(asctime)s][%(filename)s:%(lineno)d][%(levelname)s] %(message)s
